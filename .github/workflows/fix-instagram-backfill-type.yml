name: One-shot Instagram backfill type repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-instagram-backfill-type.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact minimal repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/meta/instagram-backfill.ts')
          s = p.read_text()
          old = "  const rows = Array.isArray(message?.attachments?.data)"
          new = "  const rows: any[] = Array.isArray(message?.attachments?.data)"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify production build
        run: npm run build
      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/meta/instagram-backfill.ts
          git commit -m 'fix: type historical Instagram attachments'
          git push origin HEAD:main
