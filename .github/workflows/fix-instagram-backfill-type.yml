name: One-shot Instagram backfill sale-isolation repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-instagram-backfill-type.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact minimal repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/meta/instagram-backfill.ts')
          s = p.read_text()
          old = "  let ordersSynced = 0;\n  if (localConversationId) {\n    const synced = await autoRegisterInstagramConversationSale(input.db, localConversationId);\n    if (synced.status === 'synced') ordersSynced = 1;\n  }\n"
          new = "  let ordersSynced = 0;\n  if (localConversationId) {\n    try {\n      const synced = await autoRegisterInstagramConversationSale(input.db, localConversationId);\n      if (synced.status === 'synced') ordersSynced = 1;\n    } catch (error) {\n      console.warn('instagram_backfill_sale_sync_failed', {\n        conversationId: localConversationId,\n        reason: error instanceof Error ? error.message : 'unknown',\n      });\n    }\n  }\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/meta/instagram-backfill.ts
          git commit -m 'fix: isolate Instagram sale extraction from history recovery'
          git push origin HEAD:main

# rerun after bounded-history test was updated
